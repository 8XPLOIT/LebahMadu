name: Build APK

on:
  push:
    branches: [main]
    # Mengubah config.json / index.html tidak perlu build ulang APK
    paths-ignore:
      - 'config.json'
      - 'index.html'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (release, ditandatangani, bisa menimpa versi lama)
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LebahMadu-APK
          path: app/build/outputs/apk/release/app-release.apk
