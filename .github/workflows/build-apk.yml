name: Build APK

on:
  push:
    branches: [main]
    # Mengubah config.json / index.html tidak perlu build ulang APK
    paths-ignore:
      - 'config.json'
      - 'index.html'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Isi URL otomatis dari repo ini
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          F=app/src/main/java/com/lebahmadu/app/AppConfig.kt
          sed -i "s#raw.githubusercontent.com/USERNAME/REPO/#raw.githubusercontent.com/${OWNER}/${REPO}/#" "$F"
          sed -i "s#USERNAME.github.io/REPO/#${OWNER_LC}.github.io/${REPO}/#" "$F"
          grep -n "https://" "$F"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (debug, langsung bisa diinstal)
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LebahMadu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
