    <title>LEBAH MADU UI</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* Menggunakan font modern bawaan sistem (seperti Apple/iOS) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;   /* cadangan untuk browser lama */
            min-height: 100dvh;  /* tinggi layar HP yang sebenarnya */
            margin: 0;
            padding: 1rem 0;     /* ruang atas-bawah supaya konten tidak mepet saat di-scroll */
            box-sizing: border-box;
            background-color: #09090b; /* Deep black (zinc-950) */
            color: #ffffff;
            position: relative;
            overflow-x: hidden;  /* hanya blokir geser samping; layar boleh di-scroll ke bawah */
        }

        /* Efek Glow Merah di Belakang Kaca (Glassmorphism Ambient) */
        .glow-1 {
            position: fixed;
            top: 20%;
            left: 30%;
            width: 300px;
            height: 300px;
            background-color: rgba(220, 38, 38, 0.25); /* Merah transparan */
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .glow-2 {
            position: fixed;
            bottom: 20%;
            right: 30%;
            width: 250px;
            height: 250px;
            background-color: rgba(185, 28, 28, 0.2); /* Merah lebih gelap */
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }

        /* Card Frosted Glass */
        .glass-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(1.25rem, 5vw, 2.5rem) clamp(1rem, 4.5vw, 2rem);
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);

            /* Penyesuaian agar tidak merapat ke tepi */
            box-sizing: border-box;
            max-width: 400px;
            width: 92%;
            margin: 0 auto;

            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tipografi */
        h2 {
            margin: 0 0 0.4rem 0;
            font-size: clamp(1.1rem, 5.5vw, 1.5rem);
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        p {
            margin: 0 0 clamp(1rem, 4vw, 1.5rem) 0;
            color: #a1a1aa; /* Muted gray (zinc-400) */
            font-size: clamp(0.75rem, 3.4vw, 0.9rem);
            line-height: 1.45;
        }

        /* Tombol Aksen Merah Minimalis (ukuran kecil & responsif) */
        a.btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 2.5rem;  /* tetap nyaman disentuh jari */
            background-color: #dc2626; /* Solid Red */
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            line-height: 1.15;
            padding: 0.5rem 0.5rem;
            border-radius: 0.6rem; /* Agak membulat ala iOS */
            font-weight: 600;
            font-size: clamp(0.7rem, 3.3vw, 0.875rem);
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }

        a.btn:hover {
            background-color: #b91c1c; /* Merah gelap saat di-hover */
            transform: translateY(-2px);
        }

        a.btn:active {
            transform: scale(0.97);
        }

        /* Kelompok tombol: baris atas 2, tengah 3 per baris, baris bawah 2 */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.5rem;
        }
        .btn-group a.btn { grid-column: span 2; }
        .btn-group a.btn:nth-child(-n+2),
        .btn-group a.btn:nth-last-child(-n+2) {
            grid-column: span 3;
            min-height: 2.75rem;
            font-size: clamp(0.78rem, 3.6vw, 0.95rem);
        }

        /* Tombol cadangan: kaca transparan dengan garis merah */
        a.btn.btn-alt {
            background-color: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(220, 38, 38, 0.6);
        }
        a.btn.btn-alt:hover { background-color: rgba(220, 38, 38, 0.35); }

        /* Desktop/tablet: kartu sedikit lebih lebar, ukuran teks tetap */
        @media (min-width: 640px) {
            .glass-container { max-width: 480px; }
            a.btn { font-size: 0.875rem; }
            .btn-group a.btn:nth-child(-n+2),
            .btn-group a.btn:nth-last-child(-n+2) { font-size: 0.95rem; }
        }

        /* Layar sangat kecil: semua tombol 2 kolom agar teks tidak terpotong */
        @media (max-width: 300px) {
            .btn-group a.btn { grid-column: span 3; }
        }

        /* ====== TEROWONGAN ANONIM (pengganti spinner) ====== */
        .tunnel {
            position: relative;
            width: 100%;
            height: clamp(96px, 28vw, 132px);
            margin: 0 auto 1.1rem auto;
            perspective: 240px;
            perspective-origin: 50% 50%;
            overflow: hidden;
            border-radius: 0.9rem;
            background:
                radial-gradient(ellipse at 50% 50%, rgba(220, 38, 38, 0.22), rgba(9, 9, 11, 0) 68%),
                rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
        }

        .tunnel-stage {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }

        /* Cincin terowongan yang terbang ke arah mata */
        .tunnel-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 132px;
            height: 132px;
            margin: -66px 0 0 -66px;
            border: 2px solid rgba(220, 38, 38, 0.85);
            border-radius: 26%;
            box-shadow: 0 0 14px rgba(220, 38, 38, 0.45), inset 0 0 14px rgba(220, 38, 38, 0.3);
            opacity: 0;
            animation: ring-fly 3.2s linear infinite;
        }
        .tunnel-ring:nth-child(1) { animation-delay: 0s; }
        .tunnel-ring:nth-child(2) { animation-delay: -0.45s; }
        .tunnel-ring:nth-child(3) { animation-delay: -0.9s; }
        .tunnel-ring:nth-child(4) { animation-delay: -1.35s; }
        .tunnel-ring:nth-child(5) { animation-delay: -1.8s; }
        .tunnel-ring:nth-child(6) { animation-delay: -2.25s; }
        .tunnel-ring:nth-child(7) { animation-delay: -2.7s; }

        @keyframes ring-fly {
            0%   { transform: translateZ(-520px) rotate(0deg);   opacity: 0; }
            18%  { opacity: 0.95; }
            82%  { opacity: 0.8; }
            100% { transform: translateZ(150px) rotate(22deg);   opacity: 0; }
        }

        /* Garis cahaya (warp) yang melesat di dinding terowongan */
        .tunnel-streak {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 2px;
            height: 38px;
            margin: -19px 0 0 -1px;
            border-radius: 2px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.9));
            opacity: 0;
            transform: rotate(var(--rot)) translateY(var(--rad)) translateZ(-500px);
            animation: streak-fly 2.4s linear infinite;
        }
        .tunnel-streak:nth-child(8) { --rot: 18deg;  --rad: 46px; animation-delay: -0.1s; }
        .tunnel-streak:nth-child(9) { --rot: 72deg;  --rad: 58px; animation-delay: -0.7s; }
        .tunnel-streak:nth-child(10){ --rot: 126deg; --rad: 40px; animation-delay: -1.3s; }
        .tunnel-streak:nth-child(11){ --rot: 170deg; --rad: 62px; animation-delay: -1.9s; }
        .tunnel-streak:nth-child(12){ --rot: 212deg; --rad: 44px; animation-delay: -0.4s; }
        .tunnel-streak:nth-child(13){ --rot: 268deg; --rad: 56px; animation-delay: -1.0s; }
        .tunnel-streak:nth-child(14){ --rot: 312deg; --rad: 48px; animation-delay: -1.6s; }
        .tunnel-streak:nth-child(15){ --rot: 340deg; --rad: 60px; animation-delay: -2.1s; }

        @keyframes streak-fly {
            0%   { transform: rotate(var(--rot)) translateY(var(--rad)) translateZ(-500px); opacity: 0; }
            22%  { opacity: 0.85; }
            100% { transform: rotate(var(--rot)) translateY(var(--rad)) translateZ(150px);  opacity: 0; }
        }

        /* Gembok anonimitas di mulut terowongan */
        .tunnel-lock {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            margin: -17px 0 0 -17px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(9, 9, 11, 0.72);
            border: 1px solid rgba(220, 38, 38, 0.55);
            box-shadow: 0 0 18px rgba(220, 38, 38, 0.45);
        }
        .tunnel-lock svg { width: 17px; height: 17px; display: block; }
        .tunnel-lock::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(220, 38, 38, 0.5);
            animation: lock-pulse 2.2s ease-out infinite;
        }

        @keyframes lock-pulse {
            0%   { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        /* Hormati pengaturan hemat gerak di HP/desktop */
        @media (prefers-reduced-motion: reduce) {
            .tunnel-ring, .tunnel-streak, .tunnel-lock::after { animation: none; }
            .tunnel-ring { opacity: 0.5; }
            .tunnel-ring:nth-child(1) { transform: translateZ(-60px); }
            .tunnel-ring:nth-child(2) { transform: translateZ(-180px); }
            .tunnel-ring:nth-child(3) { transform: translateZ(-320px); }
            .tunnel-ring:nth-child(4),
            .tunnel-ring:nth-child(5),
            .tunnel-ring:nth-child(6),
            .tunnel-ring:nth-child(7) { opacity: 0; }
            .tunnel-streak { opacity: 0.35; }
            .tunnel-lock::after { opacity: 0; }
        }

        /* Tombol chat Intergram selalu di atas kartu kaca */
        #intergramRoot, #intergramRoot > div { z-index: 2147483000 !important; }
    </style>
