plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// versionCode naik otomatis di setiap build GitHub Actions -> APK baru bisa menimpa (update) yang lama.
def buildNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

android {
    namespace 'com.lebahmadu.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.lebahmadu.app"
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0." + buildNumber
    }

    // Keystore TETAP: semua build ditandatangani dengan kunci yang sama, syarat wajib agar APK bisa di-update.
    // (Bisa diganti ke GitHub Secrets lewat environment variable di bawah.)
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "lebahmadu.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "LebahMadu2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "lebahmadu"
            keyPassword System.getenv("KEY_PASSWORD") ?: "LebahMadu2026"
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
